<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}设备点检工单看板{% endblock %}</title>
  <style>
    :root { --bg:#0b1020; --card:#141c33; --line:#233156; --txt:#e6ecff;
            --muted:#8aa0d0; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --accent:#38bdf8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--txt);
           font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
           min-height:100vh; padding:32px 40px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    header.top { display:flex; align-items:baseline; gap:16px;
                 border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:24px; }
    header.top h1 { font-size:26px; letter-spacing:2px; }
    header.top .sub { color:var(--muted); font-size:14px; }
    nav.crumb { margin-left:auto; font-size:14px; color:var(--muted); display:flex; gap:18px; }

    .btn { display:inline-block; padding:9px 18px; border-radius:10px; border:1px solid var(--line);
           background:var(--card); color:var(--txt); font-size:14px; cursor:pointer; }
    .btn:hover { border-color:var(--accent); text-decoration:none; }
    .btn.primary { background:var(--accent); color:#06121f; border-color:var(--accent); font-weight:600; }
    .btn.ghost { background:transparent; }

    .pill { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:600; }
    .pill.ok { background:rgba(34,197,94,.15); color:var(--ok); }
    .pill.danger { background:rgba(239,68,68,.15); color:var(--danger); }
    .pill.warn { background:rgba(245,158,11,.15); color:var(--warn); }
    .pill.accent { background:rgba(56,189,248,.15); color:var(--accent); }
    .pill.muted { background:rgba(138,160,208,.15); color:var(--muted); }

    .sec-title { display:flex; align-items:center; gap:12px; margin:28px 0 14px;
                 font-size:16px; font-weight:600; }
    .sec-title .count { color:var(--muted); font-size:13px; font-weight:400; }
    .sec-title .bar { flex:1; height:1px; background:var(--line); }

    .stat-grid.four { grid-template-columns:repeat(4,1fr); }
    .stat .num.sm { font-size:30px; }

    .fs-table td { vertical-align:middle; }
    .fs-table input[type=text], .fs-table input[type=number] {
      background:#0e1730; border:1px solid var(--line); color:var(--txt);
      padding:8px 10px; border-radius:8px; font-size:14px; width:100%; }
    .fs-del { color:var(--muted); font-size:13px; white-space:nowrap; }

    .msg { padding:12px 16px; border-radius:10px; margin-bottom:18px; font-size:14px;
           background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.35); color:#bbf7d0; }

    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 26px; }
    .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:24px; }
    .stat .label { color:var(--muted); font-size:14px; }
    .stat .num { font-size:38px; font-weight:700; margin-top:8px; }
    .num.ok { color:var(--ok); } .num.danger { color:var(--danger); }
    .num.warn { color:var(--warn); } .num.accent { color:var(--accent); }

    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:13px 14px; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--muted); font-weight:600; font-size:13px; letter-spacing:.5px; }
    tbody tr:hover { background:rgba(56,189,248,.06); }

    .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    .toolbar input, .toolbar select {
      background:#0e1730; border:1px solid var(--line); color:var(--txt);
      padding:9px 12px; border-radius:10px; font-size:14px; }
    .toolbar .spacer { margin-left:auto; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px 28px; max-width:760px; }
    .field { display:flex; flex-direction:column; gap:7px; }
    .field.full { grid-column:1 / -1; }
    .field label { font-size:14px; color:var(--muted); }
    .field input[type=text], .field input[type=number], .field select, .field textarea {
      background:#0e1730; border:1px solid var(--line); color:var(--txt);
      padding:11px 13px; border-radius:10px; font-size:15px; width:100%;
      font-family:inherit; resize:vertical; }
    .field .check { display:flex; align-items:center; gap:9px; font-size:15px; }
    .field .err { color:var(--danger); font-size:13px; }
    .form-actions { display:flex; gap:12px; margin-top:26px; }
    .hint { color:var(--muted); font-size:13px; margin-top:4px; }

    footer { margin-top:40px; color:var(--muted); font-size:12px;
             border-top:1px solid var(--line); padding-top:16px; }
    @media (max-width:640px) {
      body { padding:16px 12px; }
      header.top { flex-wrap:wrap; gap:10px; }
      header.top h1 { font-size:22px; overflow-wrap:anywhere; }
      nav.crumb { margin-left:0; flex-wrap:wrap; gap:10px 16px; width:100%; }
      .card { padding:16px; min-width:0; overflow-wrap:anywhere; }
      .form-grid, .who { grid-template-columns:minmax(0,1fr) !important; }
      .form-actions { flex-wrap:wrap; }
      .form-actions .spacer { display:none; }
      .btn { min-height:44px; }
      .field input, .field select, .field textarea { min-width:0; font-size:16px !important; }
      .stat-grid, .stat-grid.four { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .mobile-stack { grid-template-columns:minmax(0,1fr) !important; }
      .mobile-record table, .mobile-record tbody, .mobile-record tr, .mobile-record td { display:block; width:100% !important; }
      .mobile-record thead { display:none; }
      .mobile-record tr { padding:12px; border-bottom:1px solid var(--line); }
      .mobile-record td { padding:8px; border:0; }
      .mobile-record form { flex-wrap:wrap; }
      .sec-title { flex-wrap:wrap; }
      th, td { padding:10px 8px; overflow-wrap:anywhere; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>{% block heading %}设备点检工单看板{% endblock %}</h1>
    <span class="sub">某企业 · 演示大屏（数据脱敏）</span>
    <nav class="crumb">
      <a href="{% url 'board:home' %}">大屏看板</a>
      <a href="{% url 'board:equipment_list' %}">设备台账</a>
      <a href="{% url 'board:template_list' %}">点检标准</a>
      <a href="{% url 'board:plan' %}">应点检计划</a>
      <a href="{% url 'board:alerts' %}" style="color:var(--danger);">红牌预警</a>
      <a href="{% url 'board:workorder_list' %}">维修工单</a>
    </nav>
  </header>

  {% if messages %}
    {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

  <footer>Django + SQLite · 端口 18801 · 二维码内容 = /check/&lt;设备编号&gt; 扫码点检链接</footer>
</body>
</html>
